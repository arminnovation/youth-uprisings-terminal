# Installed into the PUBLIC repo as .github/workflows/headlines.yml by tools/publish_bundle.py.
# Every 10 minutes: fresh headlines from trusted outlets merged into live.json, then deploy to GitHub Pages.
# Holds no secrets; nothing is committed, so the repo history stays clean.
name: headlines
on:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
env:
  TZ: UTC
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - name: Headlines
        run: |
          cp live-core.json _runner/tracker/live.json
          (cd _runner && python3 tools/live_runner.py --once) || echo "headline poll failed; publishing without fresh headlines"
          mkdir -p "$RUNNER_TEMP/site"
          cp index.html d3.min.js topojson-client.min.js robots.txt "$RUNNER_TEMP/site/"
          cp _runner/tracker/live.json "$RUNNER_TEMP/site/live.json"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: { path: "${{ runner.temp }}/site" }
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
